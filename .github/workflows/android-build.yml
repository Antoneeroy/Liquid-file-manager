name: LIQUID FILES Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create debug keystore
        run: |
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          DIR=$(dirname "$SETTINGS")
          mkdir -p ~/.android
          for KS in "$DIR/debug.keystore" "$HOME/.android/debug.keystore"; do
            [ -f "$KS" ] || keytool -genkeypair -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          done

      - name: Build APK
        run: |
          set -eo pipefail
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          cd "$(dirname "$SETTINGS")"
          CMD=gradle
          [ -f gradlew ] && CMD=./gradlew
          [ -f gradlew ] && chmod +x gradlew
          $CMD assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log

      - name: Show error in summary
        if: failure()
        run: |
          echo "### Build error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -m1 -A 25 "What went wrong" /tmp/build.log >> $GITHUB_STEP_SUMMARY || tail -n 40 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-files-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
