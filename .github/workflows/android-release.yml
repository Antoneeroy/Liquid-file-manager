name: Liquid Files Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify-and-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Decode permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing KEYSTORE_BASE64 GitHub secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-signing.jks"

      - name: Build Signed Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          ADMOB_NATIVE_UNIT_ID: ${{ secrets.ADMOB_NATIVE_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD and KEY_PASSWORD secrets must be configured."
            exit 1
          fi
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Verifying signed APK: $APK_PATH"
          jarsigner -verify -verbose -certs "$APK_PATH"

      - name: Upload Release Artifacts (APK for Uptodown & AAB for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: liquid-files-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Cleanup keystore from runner
        if: always()
        run: rm -f "${{ github.workspace }}/release-signing.jks"
